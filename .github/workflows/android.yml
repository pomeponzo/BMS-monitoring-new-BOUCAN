name: Android · build & tests
on:
  push:
    branches: [main, feature/boucan-battery-monitor-android]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate standard Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Commit Gradle wrapper once to Android branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/boucan-battery-monitor-android'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x gradlew
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "Add generated Gradle wrapper for Android Studio"
            git push origin HEAD:feature/boucan-battery-monitor-android
          fi
      - name: Test parser and build APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publish installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Boucan-battery-monitor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
